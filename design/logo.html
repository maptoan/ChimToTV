<!doctype html>
<!--
  Nguồn logo MTV (vẽ bằng SVG, phong cách lettermark MTV hiện đại — QM-06 = B).
  Xuất PNG: node design/render.mjs  (xem cách dùng ở đầu file đó)
  ?mode=preview            : xem phương án logo
  ?mode=export&concept=e   : bày từng tài sản đúng kích thước để chụp
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  body.preview { background: #1e2026; font-family: system-ui, -apple-system, sans-serif; color: #eee; padding: 24px; }
  .row { display: flex; align-items: center; gap: 28px; margin-bottom: 28px; }
  .label { width: 150px; font-size: 20px; font-weight: 600; }
  .label small { display: block; font-size: 14px; font-weight: 500; color: #aab; margin-top: 4px; }
  .asset { position: absolute; left: 0; top: 0; }
  svg { display: block; }
</style>
</head>
<body>
<script>
const P = new URLSearchParams(location.search);

const MTV_DEFS = `
  <radialGradient id="mtvBg" cx="50%" cy="35%" r="78%">
    <stop offset="0" stop-color="#252229"/>
    <stop offset=".55" stop-color="#131218"/>
    <stop offset="1" stop-color="#08080b"/>
  </radialGradient>
  <linearGradient id="mtvWhite" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dbe2ec"/>
  </linearGradient>
  <linearGradient id="mtvGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe9a6"/>
    <stop offset=".45" stop-color="#f7c448"/>
    <stop offset="1" stop-color="#cf8617"/>
  </linearGradient>
  <linearGradient id="mtvRim" x1=".15" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#ffeab3" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#d49b38" stop-opacity=".35"/>
    <stop offset="1" stop-color="#3a2a14" stop-opacity=".8"/>
  </linearGradient>
  <linearGradient id="mtvGloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
    <stop offset=".55" stop-color="#ffffff" stop-opacity=".03"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="mtvGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
  <filter id="mtvShadow" x="-15%" y="-15%" width="130%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".55"/>
  </filter>
  <filter id="mtvBlur6" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <clipPath id="mtvRoundClip"><rect width="512" height="512" rx="118"/></clipPath>
`;

// Geometric MTV lettermark in 512x512 coordinate space (x: 74..438, y: 168..344)
function mtvLettermark() {
  return `
  <g filter="url(#mtvShadow)">
    <!-- M (warm white) -->
    <path d="M74 168 H106 L136 228 L166 168 H198 V344 H168 V226 L136 286 L104 226 V344 H74 Z" fill="url(#mtvWhite)"/>
    <!-- T (metallic gold) -->
    <path d="M212 168 H314 V198 H278 V344 H248 V198 H212 Z" fill="url(#mtvGold)"/>
    <!-- V (metallic gold) -->
    <path d="M322 168 H354 L380 292 L406 168 H438 L395 344 H365 Z" fill="url(#mtvGold)"/>
  </g>`;
}

// Rounded-square dark tile with MTV lettermark (512x512, transparent outside rx=118)
function mtvTile() {
  const rx = 118;
  return `
  <rect width="512" height="512" rx="${rx}" fill="url(#mtvBg)"/>
  <g clip-path="url(#mtvRoundClip)">
    <circle cx="256" cy="256" r="150" fill="#f5bc3b" opacity=".14" filter="url(#mtvGlow)"/>
    <ellipse cx="256" cy="80" rx="340" ry="180" fill="url(#mtvGloss)"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="${rx - 3}" fill="none" stroke="url(#mtvRim)" stroke-width="6"/>
  ${mtvLettermark()}`;
}

const concepts = {
  e: {
    name: 'MTV Lettermark',
    note: 'Lettermark MTV hiện đại: nền tối, chữ M trắng, TV vàng nổi khối (QM-06 = B)',
    tile: true,
    bgDefs: MTV_DEFS,
    bg: (w, h) => `<rect width="${w}" height="${h}" fill="url(#mtvBg)"/>`,
    mark: () => mtvTile(),
    icon: () => ``,
    banner: () => `
      <circle cx="200" cy="180" r="150" fill="#f5bc3b" opacity=".12" filter="url(#mtvGlow)"/>
      <circle cx="496" cy="180" r="130" fill="#f5bc3b" opacity=".15" filter="url(#mtvGlow)"/>
      <g transform="translate(-8 18) scale(.82)">${mtvLettermark()}</g>
      <rect x="52" y="316" width="298" height="5" rx="2.5" fill="url(#mtvGold)" opacity=".9"/>
      <g transform="translate(394 78) scale(.40)">${mtvTile()}</g>
    `,
  },
};

function defs(c) {
  return `<defs>${c.bgDefs}</defs>`;
}

function iconSvg(c, px) {
  return `<svg width="${px}" height="${px}" viewBox="0 0 512 512">${defs(c)}${c.mark()}</svg>`;
}

// Adaptive icon: 108dp -> 512; safe zone 66dp (66/108) centered on transparent background
function adaptiveSvg(c, px, layer) {
  const k = 66 / 108, off = (512 - 512 * k) / 2;
  const body = layer === 'bg' ? '' : `<g transform="translate(${off} ${off}) scale(${k})">${c.mark()}</g>`;
  return `<svg width="${px}" height="${px}" viewBox="0 0 512 512">${defs(c)}${body}</svg>`;
}

// iOS icon: full square, no transparency (iOS fills alpha with black)
function iosIconSvg(c, px) {
  return `<svg width="${px}" height="${px}" viewBox="0 0 512 512">${defs(c)}${c.bg(512, 512)}${c.mark()}</svg>`;
}

// macOS icon: 824/1024 grid (412/512) with outer drop shadow
function macIconSvg(c, px) {
  const s = 412, o = (512 - s) / 2, k = s / 512, rx = s * 118 / 512;
  return `<svg width="${px}" height="${px}" viewBox="0 0 512 512">${defs(c)}
    <defs><mask id="macOutsideTile"><rect width="512" height="512" fill="#fff"/><rect x="${o}" y="${o}" width="${s}" height="${s}" rx="${rx}" fill="#000"/></mask></defs>
    <g mask="url(#macOutsideTile)"><rect x="${o}" y="${o + 6}" width="${s}" height="${s}" rx="${rx}" fill="#000" opacity=".45" filter="url(#mtvBlur6)"/></g>
    <g transform="translate(${o} ${o}) scale(${k})">${c.mark()}</g></svg>`;
}

// TV & README Banner 16:9 — 640x360 viewBox
function bannerSvg(c, w) {
  const h = w * 9 / 16;
  return `<svg width="${w}" height="${h}" viewBox="0 0 640 360">${defs(c)}${c.bg(640, 360)}${c.banner()}</svg>`;
}

function place(items) {
  let y = 0;
  for (const [name, svg] of items) {
    const div = document.createElement('div');
    div.className = 'asset';
    div.dataset.name = name;
    div.style.top = y + 'px';
    div.innerHTML = svg;
    document.body.appendChild(div);
    y += div.firstElementChild.getAttribute('height') * 1 + 20;
  }
}

function render() {
  const c = concepts[P.get('concept') || 'e'] || concepts.e;
  if (P.get('mode') === 'site') {
    place([['../../../../site/assets/logo.png', iconSvg(c, 192)],
           ['../../../../site/assets/apple-touch-icon.png', iosIconSvg(c, 180)]]);
  } else if (P.get('mode') === 'desktop') {
    const items = [];
    for (const px of [256, 128, 64, 48, 40, 32, 24, 20, 16]) items.push([`@ico/${px}`, iconSvg(c, px)]);
    items.push(['../../../../windows/ConBangTV/logo.png', iconSvg(c, 256)]);
    for (const px of [32, 48, 64, 128, 256, 512]) items.push([`../../../../linux/packaging/icons/${px}.png`, iconSvg(c, px)]);
    place(items);
  } else if (P.get('mode') === 'mac') {
    const items = [];
    for (const px of [16, 32, 64, 128, 256, 512, 1024]) {
      items.push([`../../../../ios/ConBangTV/Assets.xcassets/AppIcon.appiconset/mac-${px}.png`, macIconSvg(c, px)]);
    }
    place(items);
  } else if (P.get('mode') === 'ios') {
    place([
      ['../../../../ios/ConBangTV/Assets.xcassets/AppIcon.appiconset/icon-1024.png', iosIconSvg(c, 1024)],
      ['../../../../ios/ConBangTV/Assets.xcassets/Logo.imageset/logo.png', iconSvg(c, 192)],
    ]);
  } else if (P.get('mode') === 'export') {
    const items = [];
    for (const [d, px] of [['mdpi', 48], ['hdpi', 72], ['xhdpi', 96], ['xxhdpi', 144], ['xxxhdpi', 192]]) {
      items.push([`mipmap-${d}/ic_launcher.png`, iconSvg(c, px)]);
      const ap = px * 108 / 48;
      items.push([`mipmap-${d}/ic_launcher_foreground.png`, adaptiveSvg(c, ap, 'fg')]);
    }
    for (const [d, w] of [['xhdpi', 320], ['xxhdpi', 480], ['xxxhdpi', 640]]) {
      items.push([`drawable-${d}/banner.png`, bannerSvg(c, w)]);
    }
    items.push(['drawable-nodpi/logo.png', iconSvg(c, 192)]);
    items.push(['../../../../design/logo-512.png', iconSvg(c, 512)]);
    items.push(['../../../../design/banner-1280.png', bannerSvg(c, 1280)]);
    place(items);
  } else {
    document.body.className = 'preview';
    for (const [k, item] of Object.entries(concepts)) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="label">${k.toUpperCase()}. ${item.name}<small>${item.note}</small></div>
        ${iconSvg(item, 220)}${iconSvg(item, 72)}${bannerSvg(item, 512)}`;
      document.body.appendChild(row);
    }
  }
}
render();
document.title = 'ready';
</script>
</body>
</html>
